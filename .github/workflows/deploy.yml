name: Deploy (reusable)

# The shared build-and-deploy pipeline for every Omnicasa app repo.
#
# Callers keep ~19 lines: which branches trigger, which environment each maps to,
# and `secrets: inherit`. Everything else lives in the caller's
# .github/deploy-manifest.yml (what the app needs) and deploy/values.yaml (how the
# chart is tuned), so app facts stay reviewable in the app's own PRs.
#
# See docs/onboarding.md before wiring a new repo.

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          GitHub Environment to deploy to, and the registry repository prefix.
          Blank falls back to the branch name.
        type: string
        required: false
        default: ""
      dry-run:
        description: Render and diff against the live release, then stop before upgrading.
        type: boolean
        required: false
        default: false
      environment-branches:
        description: >-
          Comma-separated "environment=branch" pairs. A run whose ref is not that
          branch cannot deploy that environment, and fails in seconds with a message
          saying so. Guards against a workflow_dispatch that picks the right
          environment from the wrong branch — the two are independent choices in the
          Actions UI, and nothing in the form connects them. An environment absent from
          the list is unrestricted. Set to an empty string to disable the check.
        type: string
        required: false
        # Production only. Everything else is deliberately unrestricted:
        #   staging   deploys from the `staging` branch on the four-environment flow but
        #             from whatever branch opened the PR on the two-environment one, so
        #             no single default is right for both.
        #   dev       deploys from PR head branches, which have no fixed name.
        #   prodtest  is dispatched on demand from a feature branch on purpose — it is
        #             the rehearsal environment, and rehearsing a branch before it is
        #             merged is the point. It runs on prod-k8s but serves no users.
        # A repo that wants any of them pinned passes its own list.
        default: production=main
      manifest-path:
        description: Path to the deploy manifest in the caller repo.
        type: string
        required: false
        default: .github/deploy-manifest.yml
      values-path:
        description: Per-app chart overrides. Absent file is fine.
        type: string
        required: false
        default: deploy/values.yaml
      runs-on:
        description: Runner label. Must be static — it is resolved before any step runs.
        type: string
        required: false
        default: ubuntu-latest
      image-tag:
        description: Deploy an already-built tag instead of building. Blank means github.sha.
        type: string
        required: false
        default: ""
      build:
        description: Build and push the image. false promotes an existing image.
        type: boolean
        required: false
        default: true
      build-only:
        description: >-
          Build and push, then stop. Used when two environments deploy the same commit:
          one build produces the artifact, both deploys promote it, and the two run in
          parallel instead of one waiting on the other's rollout.
        type: boolean
        required: false
        default: false
      build-context:
        type: string
        required: false
        default: .
      dockerfile:
        type: string
        required: false
        default: Dockerfile
      build-args:
        description: >-
          Multiline KEY=value passed to docker build, appended to whatever the
          manifest's `buildArgs.variables` resolved. NON-SECRET ONLY — build args are
          recorded in the image metadata and readable by anyone who can pull the image;
          a credential the build genuinely needs goes in `buildArgs.secrets`, which
          arrives as a buildx secret mount instead.

          Only useful for a value that is the same in every environment. Anything
          environment-scoped has to come from the manifest: this input is evaluated in
          the CALLER, and a caller job that uses `uses:` cannot declare `environment:`,
          so an environment variable read here is empty.
        type: string
        required: false
        default: ""
      build-platforms:
        type: string
        required: false
        default: linux/amd64
      test-command:
        description: >-
          Shell command for the test job. Blank skips the job entirely — better than a
          permanently green check, which trains everyone to ignore it.
        type: string
        required: false
        default: ""
      node-version:
        description: Node version for the test job.
        type: string
        required: false
        default: "22"
      helm-timeout:
        type: string
        required: false
        default: 10m
      rollout-timeout:
        type: string
        required: false
        default: 5m

    # No `secrets:` block. Callers pass `secrets: inherit`, and the deploy job declares
    # `environment:`, which is what makes that environment's secrets resolvable here.
    # Declaring them would mean every app-specific secret needed a line in this file,
    # which is exactly the coupling the manifest exists to remove.

    outputs:
      image:
        description: Full image reference that was deployed
        value: ${{ jobs.deploy.outputs.image }}
      image-tag:
        description: >-
          Tag that was built — the commit SHA. Set even for a build-only run, which is
          how a caller hands one build to several deploy jobs.
        value: ${{ jobs.build.outputs.image-tag }}
      environment:
        description: Resolved environment name
        value: ${{ jobs.deploy.outputs.environment }}
      app:
        description: Helm release name
        value: ${{ jobs.deploy.outputs.app }}
      namespace:
        description: Target namespace
        value: ${{ jobs.deploy.outputs.namespace }}
      revision:
        description: Helm revision after the upgrade
        value: ${{ jobs.deploy.outputs.revision }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve target
    runs-on: ${{ inputs.runs-on }}
    # No `environment:` — this job reads a file in the caller repo and needs no
    # credentials. Keeping it credential-free is why the on/off switch can be
    # evaluated before any environment protection rule has been satisfied.
    outputs:
      enabled: ${{ steps.target.outputs.enabled }}
      app: ${{ steps.target.outputs.app }}
      namespace: ${{ steps.target.outputs.namespace }}
      repository: ${{ steps.target.outputs.repository }}
    steps:
      - name: Check the environment resolved to an environment
        env:
          RESOLVED: ${{ inputs.environment || github.ref_name }}
        run: |
          set -euo pipefail
          # On a pull_request, github.ref_name is "<number>/merge" and head_ref is a
          # branch like "feat/login" — neither is a GitHub Environment. A caller that
          # forgets to pass `environment:` for PR triggers would otherwise run against
          # an environment that does not exist, resolve no secrets, and fail somewhere
          # much later with a confusing error. Checked here, before the build, so the
          # failure costs seconds rather than a full image build.
          case "$RESOLVED" in
            */*|"")
              echo "::error title=Bad environment::resolved to '$RESOLVED', which is a branch ref, not an environment name. Pass the 'environment' input explicitly — it is required for pull_request triggers."
              exit 1
              ;;
          esac
          echo "environment: $RESOLVED"

      - name: Check this ref may deploy this environment
        env:
          RESOLVED: ${{ inputs.environment || github.ref_name }}
          REF: ${{ github.ref_name }}
          POLICY: ${{ inputs.environment-branches }}
        run: |
          set -euo pipefail
          # workflow_dispatch takes a branch and an environment as two INDEPENDENT
          # choices, so nothing in the form stops someone picking `production` while
          # standing on a feature branch. GitHub's own deployment-branch policy does
          # stop it — but that is per-repo settings state: invisible in review, and
          # silently absent the day someone forgets to set it on a new repo. This is
          # the same rule expressed in code, so it holds by default everywhere.
          #
          # It is a second lock, not a replacement. Keep the environment policy set:
          # only that one also governs who may approve, and it cannot be edited by
          # someone with write access to this file.
          IFS=','
          for entry in $POLICY; do
            case "$entry" in
              *=*) ;;
              *)
                echo "::error title=Bad environment-branches::'$entry' is not environment=branch"
                exit 1
                ;;
            esac
            env_name="${entry%%=*}"
            branch="${entry#*=}"
            [ "$env_name" = "$RESOLVED" ] || continue
            if [ "$REF" != "$branch" ]; then
              echo "::error title=Wrong branch for $RESOLVED::this run is on '$REF', and '$RESOLVED' deploys only from '$branch'. Re-run the workflow with '$branch' selected. If that is genuinely wrong for this repo, change the environment-branches input in the caller."
              exit 1
            fi
            echo "ref '$REF' may deploy '$RESOLVED'"
          done
          unset IFS

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve app, namespace and repository
        id: target
        uses: omnicasa/github-actions/actions/resolve-target@v1
        with:
          environment: ${{ inputs.environment || github.ref_name }}
          manifest-path: ${{ inputs.manifest-path }}

  test:
    name: Test & lint
    if: inputs.test-command != ''
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci
      - run: ${{ inputs.test-command }}

  build:
    name: Build & push
    needs:
      - resolve
      - test
    # `always()` so a SKIPPED test job (test-command blank) does not skip this one,
    # while a FAILED test job still does — and a failed `resolve` still does too.
    #
    # A disabled environment skips the build as well as the deploy, except on a
    # build-only call: there the environment named is the one the artifact is built
    # under, not necessarily one that deploys, so turning that one off must not
    # starve the environments that promote from it.
    if: >-
      ${{ inputs.build
          && (inputs.build-only || needs.resolve.outputs.enabled == 'true')
          && always() && !failure() && !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment || github.ref_name }}
    concurrency:
      # Scoped to the repo: a bare per-environment group would serialise every
      # Omnicasa repo's build against every other one.
      group: build-${{ github.repository }}-${{ inputs.environment || github.ref_name }}
      cancel-in-progress: false
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On pull_request the default checkout is the synthetic MERGE ref. Build the
          # head commit instead: QA is testing the branch, and the image tag below
          # names that same commit, so the two cannot disagree. Empty on push events.
          ref: ${{ github.event.pull_request.head.sha }}

      - id: tag
        env:
          EXPLICIT: ${{ inputs.image-tag }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # github.sha on a pull_request is the merge commit — it exists on no branch
          # and changes whenever the base moves, so an image tagged with it cannot be
          # traced back to anything.
          tag="${EXPLICIT:-${PR_SHA:-$PUSH_SHA}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image tag: $tag"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.OVH_REGISTRY }}
          username: ${{ vars.OVH_REGISTRY_USERNAME }}
          password: ${{ secrets.OVH_REGISTRY_PASSWORD }}

      # Resolved HERE and not in the caller because a caller cannot: a job that uses
      # `uses:` may not declare `environment:`, so its `with:` sees repository and
      # organization scope only and an environment variable reads as empty. This job
      # does declare `environment:`, which is what makes the values below the target
      # environment's.
      - name: Render build args
        id: build-args
        uses: omnicasa/github-actions/actions/render-build-args@v1
        with:
          environment: ${{ inputs.environment || github.ref_name }}
          manifest-path: ${{ inputs.manifest-path }}
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}
          # Merged inside the action rather than concatenated here: a `|` list built
          # from two expressions leaves a blank line whenever either is empty.
          extra-build-args: ${{ inputs.build-args }}

      - uses: docker/build-push-action@v6
        with:
          # Explicit, because the default context is the git ref — which ignores
          # anything a previous step generated in the workspace.
          context: ${{ inputs.build-context }}
          file: ${{ inputs.build-context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.build-platforms }}
          push: true
          # One immutable SHA tag. No `latest`: a floating tag makes "what is
          # running?" unanswerable and gives rollback no fixed target.
          tags: ${{ vars.OVH_REGISTRY }}/${{ needs.resolve.outputs.repository }}:${{ steps.tag.outputs.tag }}
          # Already merged with `inputs.build-args` by the step above.
          build-args: ${{ steps.build-args.outputs.build-args }}
          # buildx secret mounts, from the manifest's buildArgs.secrets. Unlike a
          # build arg these are never recorded in the image metadata or the cache,
          # which is what makes them safe for a credential the build genuinely needs.
          # Rendered as NAME=PATH: a malformed line here only WARNS, and the build then
          # runs with the mount empty, so the app's Dockerfile must check for that.
          secret-files: ${{ steps.build-args.outputs.secret-files }}
          # Cache lives with the repo, so there is no registry cache image to garbage-collect.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `always()`, because a failed build leaves the files behind just the same, and
      # the runner is reused across jobs on self-hosted labels.
      - name: Shred build secrets
        if: always()
        env:
          SECRETS_DIR: ${{ runner.temp }}/build-secrets
        run: |
          set -euo pipefail
          [ -d "$SECRETS_DIR" ] || exit 0
          find "$SECRETS_DIR" -type f -exec shred -u {} + 2>/dev/null || true
          rm -rf "$SECRETS_DIR"

  deploy:
    name: Deploy
    needs:
      - resolve
      - build
    # Runs when build succeeded OR was skipped (inputs.build false), never after a
    # failure. Two extra gates:
    #   - `enabled`: the manifest turned this environment off, so the run is green and
    #     says so rather than red for a deploy nobody wanted.
    #   - `build-only`: this call exists to produce an artifact for someone else's
    #     deploy job.
    if: >-
      ${{ needs.resolve.outputs.enabled == 'true' && !inputs.build-only
          && always() && !failure() && !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    # `environment:` and `concurrency:` cannot read the `env` context, so this
    # expression is repeated inline rather than factored into a variable. Referencing
    # `env` here fails silently — the job runs with no environment at all.
    environment: ${{ inputs.environment || github.ref_name }}
    concurrency:
      group: ${{ github.repository }}-${{ inputs.environment || github.ref_name }}
      # Never cancel a run mid-`helm upgrade`: it leaves the release in
      # pending-upgrade AND leaves the runner's IP on the OVH allowlist.
      # The rollback workflow uses this same group so the two cannot overlap.
      cancel-in-progress: false
    outputs:
      image: ${{ steps.render.outputs.image }}
      environment: ${{ inputs.environment || github.ref_name }}
      app: ${{ steps.render.outputs.app }}
      namespace: ${{ steps.render.outputs.namespace }}
      revision: ${{ steps.helm.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Same head commit the image was built from, so the manifest and values
          # match the code in the image rather than the merge preview.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup cluster tooling
        uses: omnicasa/github-actions/actions/setup-cluster@v1
        with:
          kubeconfig-base64: ${{ secrets.KUBECONFIG_BASE64 }}

      - name: Authorise runner IP
        id: allowlist
        uses: omnicasa/github-actions/actions/ovh-ip-allowlist@v1
        with:
          action: add
          project-id: ${{ vars.OVH_PROJECT_ID }}
          kubernetes-id: ${{ vars.OVH_KUBERNETES_ID }}
          application-key: ${{ secrets.OVH_GA_APPLICATION_KEY }}
          application-secret: ${{ secrets.OVH_GA_APPLICATION_SECRET }}
          consumer-key: ${{ secrets.OVH_GA_CONSUMER_KEY }}

      - name: Render Helm values
        id: render
        uses: omnicasa/github-actions/actions/render-values@v1
        with:
          manifest-path: ${{ inputs.manifest-path }}
          environment: ${{ inputs.environment || github.ref_name }}
          image-tag: ${{ needs.build.outputs.image-tag || inputs.image-tag || github.event.pull_request.head.sha || github.sha }}
          # From the same resolver the build job pushed with, so a promoted image
          # (prodtest reading staging/<app>) cannot end up looking somewhere else.
          repository: ${{ needs.resolve.outputs.repository }}
          # The manifest allowlists what the app actually receives; anything not
          # listed there — github_token included — is dropped by the renderer.
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}

      - name: Deploy with Helm
        id: helm
        uses: omnicasa/github-actions/actions/helm-deploy@v1
        with:
          release: ${{ steps.render.outputs.app }}
          namespace: ${{ steps.render.outputs.namespace }}
          image-pull-secret: ${{ vars.IMAGE_PULL_SECRET_NAME }}
          dry-run: ${{ inputs.dry-run }}
          timeout: ${{ inputs.helm-timeout }}
          rollout-timeout: ${{ inputs.rollout-timeout }}
          # Order matters and must match what the diff used: per-app, then
          # per-environment, then the computed files.
          values-files: |
            ${{ inputs.values-path }}
            ${{ format('deploy/values.{0}.yaml', inputs.environment || github.ref_name) }}
            ${{ steps.render.outputs.release-values }}
            ${{ steps.render.outputs.app-env-values }}

      - name: Diagnostics
        # The single highest-value step here: --atomic rolls back before the job
        # ends and deletes the failed pods, events and logs.
        #
        # Gated on render's own outcome: if "Render Helm values" is what failed (e.g.
        # a manifest `required:` key with no value here), its outputs were never set
        # — running k8s-diagnostics anyway crashes on blank namespace/release instead
        # of skipping, masking the real error.
        if: failure() && steps.render.outcome == 'success'
        uses: omnicasa/github-actions/actions/k8s-diagnostics@v1
        with:
          namespace: ${{ steps.render.outputs.namespace }}
          release: ${{ steps.render.outputs.app }}

      - name: Remove rendered values
        if: always()
        run: rm -f /tmp/release-values.json /tmp/app-env-values.json

      - name: Remove runner IP
        if: always()
        uses: omnicasa/github-actions/actions/ovh-ip-allowlist@v1
        with:
          action: remove
          # The IP the add step actually used, in case the runner's egress
          # address rotated during the job.
          ip: ${{ steps.allowlist.outputs.ip }}
          project-id: ${{ vars.OVH_PROJECT_ID }}
          kubernetes-id: ${{ vars.OVH_KUBERNETES_ID }}
          application-key: ${{ secrets.OVH_GA_APPLICATION_KEY }}
          application-secret: ${{ secrets.OVH_GA_APPLICATION_SECRET }}
          consumer-key: ${{ secrets.OVH_GA_CONSUMER_KEY }}
          # Must not mask the real deploy failure with an allowlist error.
          fail-on-error: "false"

  notify:
    name: Notify Teams (production)
    needs: [resolve, test, build, deploy]
    # always(): a failed earlier job is the case most worth reporting. No
    # `environment:`: MSTEAMS_* are org-level secrets on purpose, so this never
    # queues behind production's required-reviewer gate like the failed deploy did.
    if: always() && (inputs.environment || github.ref_name) == 'production'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Notify deploys channel
        uses: omnicasa/github-actions/actions/teams-notify@v1
        with:
          webhook-url: ${{ secrets.MSTEAMS_WEBHOOK_URL_DEPLOYS }}
          # success()/failure() only work at the top of an if:, not inside with:;
          # contains() is a plain function and works in both places.
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          title: ${{ contains(needs.*.result, 'failure') && format('⚠️ {0} — Production deploy failed', github.repository) || format('✅ {0} — Production deploy succeeded', github.repository) }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Repository dropped: already in the title. "Failed at" is blank (and
          # dropped) unless a job actually failed.
          facts: |
            Triggered by: ${{ github.actor }}
            Ref: ${{ github.ref_name }}
            Image tag: ${{ needs.build.outputs.image-tag }}
            App: ${{ needs.resolve.outputs.namespace }} / ${{ needs.resolve.outputs.app }}
            ${{ contains(needs.*.result, 'failure') && format('Failed at: {0}', needs.resolve.result == 'failure' && 'resolve' || (needs.test.result == 'failure' && 'test' || (needs.build.result == 'failure' && 'build' || 'deploy'))) || '' }}

      # Failures only, for on-call — without the noise of every success too.
      - name: Notify alerts channel
        if: contains(needs.*.result, 'failure')
        uses: omnicasa/github-actions/actions/teams-notify@v1
        with:
          webhook-url: ${{ secrets.MSTEAMS_WEBHOOK_URL_ALERTS }}
          status: failure
          title: ${{ format('🚨 {0} — Production deploy failed', github.repository) }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          facts: |
            Triggered by: ${{ github.actor }}
            Ref: ${{ github.ref_name }}
            Image tag: ${{ needs.build.outputs.image-tag }}
            App: ${{ needs.resolve.outputs.namespace }} / ${{ needs.resolve.outputs.app }}
            ${{ contains(needs.*.result, 'failure') && format('Failed at: {0}', needs.resolve.result == 'failure' && 'resolve' || (needs.test.result == 'failure' && 'test' || (needs.build.result == 'failure' && 'build' || 'deploy'))) || '' }}
