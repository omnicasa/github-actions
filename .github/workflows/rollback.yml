name: Rollback (reusable)

# Rollback is its own workflow, not a flag on the deploy. During an incident you want
# a form with two fields — which environment, which revision — not a rerun of a
# pipeline that would rebuild an image you have just decided not to trust.
#
# It shares the deploy workflow's concurrency group on purpose, so a rollback and a
# deploy can never touch the same release at once.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment holding the release
        type: string
        required: true
      revision:
        description: Helm revision to roll back to. Blank means the previous one.
        type: string
        required: false
        default: ""
      manifest-path:
        type: string
        required: false
        default: .github/deploy-manifest.yml
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
      timeout:
        type: string
        required: false
        default: 10m

    outputs:
      revision:
        description: Helm revision after the rollback
        value: ${{ jobs.rollback.outputs.revision }}

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    concurrency:
      # IDENTICAL to the deploy workflow's group. If these two ever diverge, a
      # rollback and a deploy can run against the same release simultaneously.
      group: ${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      revision: ${{ steps.rollback.outputs.revision }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup cluster tooling
        uses: omnicasa/github-actions/actions/setup-cluster@v1
        with:
          kubeconfig-base64: ${{ secrets.KUBECONFIG_BASE64 }}

      - name: Authorise runner IP
        id: allowlist
        uses: omnicasa/github-actions/actions/ovh-ip-allowlist@v1
        with:
          action: add
          project-id: ${{ vars.OVH_PROJECT_ID }}
          kubernetes-id: ${{ vars.OVH_KUBERNETES_ID }}
          application-key: ${{ secrets.OVH_GA_APPLICATION_KEY }}
          application-secret: ${{ secrets.OVH_GA_APPLICATION_SECRET }}
          consumer-key: ${{ secrets.OVH_GA_CONSUMER_KEY }}

      # Same resolver the deploy uses. Rolling back in the wrong namespace is the
      # worst possible time to discover that two files disagreed about which one
      # `dev` or `prodtest` means.
      - name: Read app and namespace from the manifest
        id: manifest
        uses: omnicasa/github-actions/actions/resolve-target@v1
        with:
          environment: ${{ inputs.environment }}
          manifest-path: ${{ inputs.manifest-path }}

      - name: Roll back
        id: rollback
        uses: omnicasa/github-actions/actions/helm-rollback@v1
        with:
          release: ${{ steps.manifest.outputs.app }}
          namespace: ${{ steps.manifest.outputs.namespace }}
          revision: ${{ inputs.revision }}
          timeout: ${{ inputs.timeout }}

      - name: Diagnostics
        if: failure()
        uses: omnicasa/github-actions/actions/k8s-diagnostics@v1
        with:
          namespace: ${{ steps.manifest.outputs.namespace }}
          release: ${{ steps.manifest.outputs.app }}

      - name: Remove runner IP
        if: always()
        uses: omnicasa/github-actions/actions/ovh-ip-allowlist@v1
        with:
          action: remove
          ip: ${{ steps.allowlist.outputs.ip }}
          project-id: ${{ vars.OVH_PROJECT_ID }}
          kubernetes-id: ${{ vars.OVH_KUBERNETES_ID }}
          application-key: ${{ secrets.OVH_GA_APPLICATION_KEY }}
          application-secret: ${{ secrets.OVH_GA_APPLICATION_SECRET }}
          consumer-key: ${{ secrets.OVH_GA_CONSUMER_KEY }}
          fail-on-error: "false"

  notify:
    name: Notify Teams (production)
    needs: rollback
    # Same shape as deploy.yml's notify job, including the missing `environment:`
    # — see that comment. A rollback is by definition an incident already in
    # progress; the alert must not wait on the approval the failed release skipped.
    if: always() && inputs.environment == 'production'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Notify deploys channel
        uses: omnicasa/github-actions/actions/teams-notify@feat/teams-notify-repo-in-title
        with:
          webhook-url: ${{ secrets.MSTEAMS_WEBHOOK_URL_DEPLOYS }}
          # success()/failure() are only valid at the top of an `if:`, not inside a
          # `with:` expression. contains() is a plain function, valid in either place.
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          title: ${{ contains(needs.*.result, 'failure') && format('⚠️ {0} — Production rollback failed', github.repository) || format('✅ {0} — Production rollback succeeded', github.repository) }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Repository is dropped: it's already in the title.
          # Rollback result is dropped when it's success — the title's ✅/⚠️ already
          # says so; a blank line here (only) prints when it's not.
          facts: |
            Triggered by: ${{ github.actor }}
            Revision requested: ${{ inputs.revision || 'previous' }}
            Revision after: ${{ needs.rollback.outputs.revision }}
            ${{ needs.rollback.result != 'success' && format('Rollback: {0}', needs.rollback.result) || '' }}

      - name: Notify alerts channel
        if: contains(needs.*.result, 'failure')
        uses: omnicasa/github-actions/actions/teams-notify@feat/teams-notify-repo-in-title
        with:
          webhook-url: ${{ secrets.MSTEAMS_WEBHOOK_URL_ALERTS }}
          status: failure
          title: ${{ format('🚨 {0} — Production rollback failed', github.repository) }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Repository is dropped: it's already in the title.
          # Rollback result is dropped when it's success — the title's ✅/⚠️ already
          # says so; a blank line here (only) prints when it's not.
          facts: |
            Triggered by: ${{ github.actor }}
            Revision requested: ${{ inputs.revision || 'previous' }}
            Revision after: ${{ needs.rollback.outputs.revision }}
            ${{ needs.rollback.result != 'success' && format('Rollback: {0}', needs.rollback.result) || '' }}
