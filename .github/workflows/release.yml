name: Release

# Moves the floating major tag (v1) to an annotated vX.Y.Z, and publishes release notes.
#
# Consumers are told to pin exact tags; v1 exists for anyone who explicitly opts into
# unreviewed updates. Because moving it changes what every such consumer runs on their
# next deploy, only this workflow moves it — never a human, never a force-push.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # On a tag push this is the tag already. On workflow_dispatch it is NOT: the
          # default ref is the branch chosen in the Actions UI, so without this line a
          # dispatch of `tag: v1.5.0` from main checked out MAIN and moved v1 to main's
          # HEAD while announcing v1.5.0. That is the rollback path, so it silently did
          # the opposite of what it was asked.
          ref: ${{ inputs.tag || github.ref_name }}

      - id: version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$tag is not vX.Y.Z"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"

      - name: Refuse to release an unrecorded change
        run: |
          set -euo pipefail
          # A consumer deciding whether to bump reads CHANGELOG.md. A release absent
          # from it gives them nothing to decide with.
          grep -q "${{ steps.version.outputs.tag }}" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no entry for ${{ steps.version.outputs.tag }}"; exit 1; }

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            || gh release edit "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}"

      # This job cannot move `v1` itself. GITHUB_TOKEN is a GitHub App token, and both
      # the Git push endpoint and the REST refs API refuse to point a ref at a tree that
      # touches .github/workflows unless the token holds a `workflows` permission — which
      # is not a key a permissions: block can set, so the workflow cannot grant it to
      # itself. Confirmed on run 37140676761: git push is rejected outright, and
      # PATCH /git/refs/tags/v1 answers 403 Resource not accessible by integration.
      # Almost every release here changes a workflow, so this is the normal path, not
      # an edge case.
      #
      # Automating it again needs a PAT or a GitHub App with Workflows: write, i.e. a
      # stored credential that can rewrite CI — weigh that against a one-line manual
      # step before reaching for it.
      - name: Hand over the v1 move
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          set -euo pipefail
          target=$(git rev-list -n1 "$TAG")
          current=$(git rev-list -n1 "$MAJOR" 2>/dev/null || echo none)

          if [ "$current" = "$target" ]; then
            echo "::notice::$MAJOR already points at $TAG ($target)"
            exit 0
          fi

          # A warning, not an error: the tag and the release notes above are real, and
          # failing the run would imply they are not. What is outstanding is one push.
          echo "::warning::$MAJOR still points at $current — move it with the command in the job summary"

          # Written with echo, not a heredoc: a heredoc body inside this block scalar
          # carries the YAML indentation into the summary, and leading spaces turn
          # markdown into a code block and break the fences below.
          {
            echo "### $MAJOR is not on $TAG yet"
            echo
            echo "Consumers tracking \`$MAJOR\` keep running \`$current\` until someone"
            echo "with their own credentials runs:"
            echo
            echo '```'
            echo "git fetch origin --tags"
            echo "git tag -f -a $MAJOR -m \"Track $TAG\" $target"
            echo "git push -f origin $MAJOR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
