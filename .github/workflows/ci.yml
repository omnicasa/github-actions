name: CI

# This repo has one consumer today and will have seven. A bad merge here breaks all of
# them at once, so every gate that can run without a cluster runs on every PR.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v3.19.0
  CHART: actions/helm-deploy/chart

jobs:
  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck actions/*/*.sh scripts/*.sh

      - name: Python syntax and style
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ruff pyyaml
          files="actions/render-values/render-values.py
          actions/render-build-args/render-build-args.py
          actions/resolve-target/target.py
          actions/resolve-target/resolve.py
          actions/doppler-secrets/doppler_secrets.py
          scripts/validate-manifest.py"
          # shellcheck disable=SC2086  # word splitting is the point
          python3 -m py_compile $files
          # shellcheck disable=SC2086
          ruff check $files

      - name: Internal action refs all agree
        run: |
          set -euo pipefail
          # A called workflow's `uses:` is resolved fresh — it does NOT inherit the ref
          # the workflow itself was loaded from. So a workflow tagged v1.0.0 that invokes
          # its actions at @v1 silently combines two versions. Every internal ref must
          # therefore be the same string. The first release shipped with @v1 refs while
          # only v1.0.0 existed, and every run failed with "unable to find version v1".
          # Only the reusable workflows, by name. Scanning .github/workflows/ as a
          # directory would match this very grep pattern inside ci.yml.
          extract() { grep -hoE 'uses: omnicasa/github-actions/\S+@\S+' "$@" | cut -d@ -f2 | sort -u; }
          refs=$(extract .github/workflows/deploy.yml .github/workflows/rollback.yml)
          echo "refs in use:"; echo "$refs"
          if [ "$(echo "$refs" | wc -l)" -ne 1 ]; then
            echo "::error::internal refs disagree — every omnicasa/github-actions ref must use the same tag"
            exit 1
          fi
          # Templates hand this ref to app repos; they must match too.
          tmpl=$(extract templates/caller-*.yml)
          if [ "$tmpl" != "$refs" ]; then
            echo "::error::templates/ use '$tmpl' but the workflows use '$refs'"
            exit 1
          fi
          echo "all internal and template refs agree on $refs"

      - name: Composite action metadata parses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob("actions/*/action.yml")):
              try:
                  d = yaml.safe_load(open(f))
              except Exception as exc:
                  print(f"FAIL {f}: {exc}"); bad = 1; continue
              if d.get("runs", {}).get("using") != "composite":
                  print(f"FAIL {f}: runs.using must be composite"); bad = 1
              for step in d.get("runs", {}).get("steps", []):
                  if "run" in step and "shell" not in step:
                      print(f"FAIL {f}: a run: step is missing shell:"); bad = 1

              # The runner evaluates input/output DESCRIPTIONS as templates, and a
              # composite manifest has neither `vars` nor `secrets` in scope. Writing
              # one there as documentation makes the action fail to load entirely,
              # which actionlint does not catch because it does not read action.yml.
              # The marker is built rather than written literally: a bare dollar-brace
              # in this file is itself parsed as a workflow expression.
              marker = "$" + "{{"
              for section in ("inputs", "outputs"):
                  for name, spec in (d.get(section) or {}).items():
                      if marker in str((spec or {}).get("description", "")):
                          print(f"FAIL {f}: {section}.{name}.description contains a "
                                "workflow expression; write it as prose")
                          bad = 1
              print(f"ok {f}")
          sys.exit(bad)
          PY

  secret-leak:
    name: Renderer never prints a value
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet pyyaml

      - name: Render with planted secrets, assert none appear
        run: |
          set -euo pipefail
          # Every name below must be in the fixture manifest's allowlist, or the
          # renderer correctly drops it and the assertions below have nothing to check.
          # Keep these two in step when the fixture changes.
          export VARS_JSON='{"OVH_REGISTRY":"reg.example","IMAGE_PULL_SECRET_NAME":"ovh-reg","APP_DOMAIN":"tools.example.com","NODE_ENV":"production","SMTP_HOST":"smtp.example","SMTP_PORT":"587","EMAIL_FROM":"noreply@example","AUTH_TRUST_HOST":"true","CUSTOMER_DB_CONNECT_TIMEOUT_MS":"45000"}'
          # A comma-bearing password and a JSON map: both would corrupt a release
          # under `helm --set`, which is why values files exist.
          export SECRETS_JSON='{"AUTH_SECRET":"CANARY_AUTH","CRM_CUSTOMER_DATABASE_URL":"Server=h;Password=CANARY,WITH,COMMAS","OMNICASA_DATABASE_URL":"Server=h2;Password=CANARY_OMNI","CUSTOMER_DB_HOST_MAP":"{\"a\":\"1.2.3.4\"}","POSTMARK_API_KEY":"CANARY_PM","github_token":"CANARY_TOKEN"}'
          export ENVIRONMENT=production IMAGE_TAG=deadbeef
          export DEPLOY_MANIFEST=tests/fixtures/omnicasa-tools/deploy-manifest.yml
          export RELEASE_VALUES_OUT=/tmp/release-values.json
          export APP_ENV_VALUES_OUT=/tmp/app-env-values.json

          python3 actions/render-values/render-values.py > /tmp/render.log 2>&1
          cat /tmp/render.log

          # The script is handed the whole secrets context, so one careless print
          # would leak everything. Assert on the log, not on intent.
          if grep -qE 'CANARY_AUTH|CANARY,WITH,COMMAS|CANARY_TOKEN' /tmp/render.log; then
            echo "::error::render-values.py printed a secret value"; exit 1
          fi

          # github_token is in the context but not the manifest allowlist.
          if grep -q 'CANARY_TOKEN' /tmp/app-env-values.json; then
            echo "::error::github_token reached the release"; exit 1
          fi

          # The comma-bearing password must survive byte-for-byte.
          python3 - <<'PY'
          import json, sys
          env = json.load(open("/tmp/app-env-values.json"))["config"]["env"]
          secrets, variables = env["secrets"], env["variables"]

          # A KeyError here means the planted name is not in the fixture manifest's
          # allowlist — a broken test, not a broken renderer. Say which.
          expected = {
              "CRM_CUSTOMER_DATABASE_URL": "Server=h;Password=CANARY,WITH,COMMAS",
              "CUSTOMER_DB_HOST_MAP": '{"a":"1.2.3.4"}',
          }
          missing = sorted(k for k in expected if k not in secrets)
          if missing:
              print(f"::error::{', '.join(missing)} not in the rendered secrets — "
                    "is it still listed under env.secrets in the fixture manifest?")
              sys.exit(1)
          for key, want in expected.items():
              assert secrets[key] == want, f"{key}: {secrets[key]!r} != {want!r}"

          # Derived values land on the variables side, never in the Secret.
          assert variables["AUTH_URL"] == "https://tools.example.com", variables["AUTH_URL"]
          assert "AUTH_URL" not in secrets
          print("commas and JSON survived intact; derived value on the variables side")
          PY
          rm -f /tmp/*-values.json

      - name: Doppler overlay overrides by name, platform keys stay denied
        run: |
          set -euo pipefail
          # Same base context as the previous step, minus the canaries this one
          # doesn't need. AUTH_SECRET and SMTP_HOST are overridden by the Doppler
          # overlay; the rest proves everything not overridden still comes from
          # GitHub, and that a platform key smuggled into the overlay never survives.
          export VARS_JSON='{"OVH_REGISTRY":"reg.example","IMAGE_PULL_SECRET_NAME":"ovh-reg","APP_DOMAIN":"tools.example.com","NODE_ENV":"production","SMTP_HOST":"github-smtp.example","SMTP_PORT":"587","EMAIL_FROM":"noreply@example","AUTH_TRUST_HOST":"true","CUSTOMER_DB_CONNECT_TIMEOUT_MS":"45000"}'
          export SECRETS_JSON='{"AUTH_SECRET":"CANARY_GITHUB_AUTH","CRM_CUSTOMER_DATABASE_URL":"Server=h;Password=CANARY_CRM","OMNICASA_DATABASE_URL":"Server=h2;Password=CANARY_OMNI","CUSTOMER_DB_HOST_MAP":"{\"a\":\"1.2.3.4\"}","POSTMARK_API_KEY":"CANARY_PM"}'
          export ENVIRONMENT=production IMAGE_TAG=deadbeef
          export DEPLOY_MANIFEST=tests/fixtures/omnicasa-tools/deploy-manifest.yml
          export RELEASE_VALUES_OUT=/tmp/release-values.json
          export APP_ENV_VALUES_OUT=/tmp/app-env-values.json

          # KUBECONFIG_BASE64 is a platform key and must never reach either output
          # file, however it got into the overlay. UNUSED_DOPPLER_KEY is not in the
          # manifest allowlist and must be dropped like any GitHub-sourced key would be.
          export DOPPLER_SECRETS_FILE=/tmp/doppler-secrets.json
          cat > "$DOPPLER_SECRETS_FILE" <<'JSON'
          {"AUTH_SECRET":"CANARY_DOPPLER_AUTH","SMTP_HOST":"doppler-smtp.example","KUBECONFIG_BASE64":"CANARY_KUBECONFIG","UNUSED_DOPPLER_KEY":"CANARY_UNUSED"}
          JSON

          python3 actions/render-values/render-values.py > /tmp/render-doppler.log 2>&1
          cat /tmp/render-doppler.log

          if grep -qE 'CANARY_DOPPLER_AUTH|doppler-smtp.example|CANARY_KUBECONFIG|CANARY_UNUSED|CANARY_GITHUB_AUTH' /tmp/render-doppler.log; then
            echo "::error::render-values.py printed a value it should only ever name"; exit 1
          fi

          # The provenance line names the two overridden keys, and only by name.
          grep -q 'tier 2 (Doppler) overrides: AUTH_SECRET, SMTP_HOST' /tmp/render-doppler.log \
            || { echo "::error::missing or wrong provenance line for the Doppler override"; exit 1; }
          grep -q 'not in the manifest allowlist, ignored: UNUSED_DOPPLER_KEY' /tmp/render-doppler.log \
            || { echo "::error::missing provenance line for the unused Doppler key"; exit 1; }

          python3 - <<'PY'
          import json
          env = json.load(open("/tmp/app-env-values.json"))["config"]["env"]
          secrets, variables = env["secrets"], env["variables"]

          assert secrets["AUTH_SECRET"] == "CANARY_DOPPLER_AUTH", "Doppler did not win over GitHub"
          assert variables["SMTP_HOST"] == "doppler-smtp.example", "Doppler did not win over GitHub"
          # Untouched keys still come from GitHub.
          assert secrets["CRM_CUSTOMER_DATABASE_URL"] == "Server=h;Password=CANARY_CRM"

          release = json.load(open("/tmp/release-values.json"))
          assert release["image"]["registry"] == "reg.example", "release values must ignore the overlay entirely"
          print("Doppler overlay overrides by name; platform key and unlisted key both dropped")
          PY

          # The platform key must not have reached the cluster-facing file either,
          # under any key name — belt and braces on top of the JSON-level assertions.
          if grep -q 'CANARY_KUBECONFIG' /tmp/release-values.json /tmp/app-env-values.json; then
            echo "::error::a platform-key value from the Doppler overlay reached a rendered file"; exit 1
          fi
          rm -f /tmp/*-values.json /tmp/doppler-secrets.json

      - name: Render build args with planted secrets, assert none appear
        run: |
          set -euo pipefail
          # Same contract as the block above: this script is handed the whole secrets
          # context, so one careless print leaks everything.
          export VARS_JSON='{"PUBLIC_API_URL":"https://api.example.com","APP_DOMAIN":"a.example"}'
          export SECRETS_JSON='{"PUBLIC_ANON_KEY":"CANARY_ANON","BUILD_UPLOAD_TOKEN":"CANARY_UPLOAD","SERVER_ONLY_TOKEN":"CANARY_SERVER","github_token":"CANARY_TOKEN"}'
          export ENVIRONMENT=production
          export DEPLOY_MANIFEST=tests/fixtures/buildargs/deploy-manifest.yml
          export SECRETS_DIR=/tmp/build-secrets
          export GITHUB_OUTPUT=/tmp/build-args-output.txt
          : > "$GITHUB_OUTPUT"

          python3 actions/render-build-args/render-build-args.py > /tmp/build-args.log 2>&1
          cat /tmp/build-args.log

          if grep -qE 'CANARY_ANON|CANARY_UPLOAD|CANARY_SERVER|CANARY_TOKEN' /tmp/build-args.log; then
            echo "::error::render-build-args.py printed a secret value"; exit 1
          fi

          # A build arg IS recorded in the image metadata, so the step output is the
          # one place a value legitimately appears — but only for the variables side.
          # A secret must reach the build as a file path and nothing else.
          if grep -qE 'CANARY_ANON|CANARY_UPLOAD|CANARY_SERVER|CANARY_TOKEN' "$GITHUB_OUTPUT"; then
            echo "::error::a build secret value reached the step output"; exit 1
          fi

          # SERVER_ONLY_TOKEN is in env.secrets but not in buildArgs — it must not be
          # written out at all. This is the check that keeps the build surface minimal.
          if [ -e /tmp/build-secrets/SERVER_ONLY_TOKEN ] || [ -e /tmp/build-secrets/github_token ]; then
            echo "::error::a secret outside the buildArgs allowlist was written"; exit 1
          fi

          for name in PUBLIC_ANON_KEY BUILD_UPLOAD_TOKEN; do
            test -f "/tmp/build-secrets/$name" \
              || { echo "::error::$name was not written"; exit 1; }
            # 0600 in a 0700 dir. buildx reads them as the same user.
            test "$(stat -c '%a' "/tmp/build-secrets/$name")" = "600" \
              || { echo "::error::$name is not mode 0600"; exit 1; }
            # `cat` in the Dockerfile means a trailing newline silently corrupts a
            # token. Command substitution strips a trailing newline, so an empty
            # result here means the file ended with one.
            test -n "$(tail -c1 "/tmp/build-secrets/$name")" \
              || { echo "::error::$name ends with a newline"; exit 1; }
          done

          grep -q 'PUBLIC_API_URL=https://api.example.com' "$GITHUB_OUTPUT" \
            || { echo "::error::build arg variable missing from the output"; exit 1; }

          # docker/build-push-action's secret-files takes NAME=PATH. The buildx CLI
          # form id=NAME,src=PATH only produces a WARNING there — the build then runs
          # with the mount empty and fails much later, somewhere unrelated. Pin it.
          for name in PUBLIC_ANON_KEY BUILD_UPLOAD_TOKEN; do
            grep -qE "^$name=/" "$GITHUB_OUTPUT" \
              || { echo "::error::secret-files line for $name is not NAME=PATH"; exit 1; }
          done
          if grep -q 'id=.*,src=' "$GITHUB_OUTPUT"; then
            echo "::error::secret-files uses the buildx CLI form; the action wants NAME=PATH"
            exit 1
          fi
          echo "build args rendered; secret-files in NAME=PATH form; no value left the mounts"

          shred -u /tmp/build-secrets/* && rm -rf /tmp/build-secrets
          rm -f /tmp/build-args-output.txt /tmp/build-args.log

      - name: The build-args input still works, and the manifest outranks it
        run: |
          set -euo pipefail
          export ENVIRONMENT=production SECRETS_DIR=/tmp/build-secrets-merge
          export VARS_JSON='{"PUBLIC_API_URL":"https://api.example.com","APP_DOMAIN":"a.example"}'
          export SECRETS_JSON='{"PUBLIC_ANON_KEY":"k","BUILD_UPLOAD_TOKEN":"t"}'

          # Back-compat: a repo with no buildArgs block that passes the workflow input
          # must still get its build arg. This is every repo that existed before the
          # manifest block was added.
          export DEPLOY_MANIFEST=tests/fixtures/omnicasa-tools/deploy-manifest.yml
          export EXTRA_BUILD_ARGS='NODE_ENV=production'
          export GITHUB_OUTPUT=/tmp/merge-output.txt; : > "$GITHUB_OUTPUT"
          python3 actions/render-build-args/render-build-args.py
          grep -q 'NODE_ENV=production' "$GITHUB_OUTPUT" \
            || { echo "::error::the build-args input was dropped"; exit 1; }

          # Precedence: only the manifest is resolved at the target environment's
          # scope, so on a collision it wins and the caller is told to drop its copy.
          export DEPLOY_MANIFEST=tests/fixtures/buildargs/deploy-manifest.yml
          export EXTRA_BUILD_ARGS='PUBLIC_API_URL=https://stale.example'
          : > "$GITHUB_OUTPUT"
          python3 actions/render-build-args/render-build-args.py > /tmp/merge.log 2>&1
          cat /tmp/merge.log
          grep -q 'PUBLIC_API_URL=https://api.example.com' "$GITHUB_OUTPUT" \
            || { echo "::error::the manifest did not override the input"; exit 1; }
          if grep -q 'stale.example' "$GITHUB_OUTPUT"; then
            echo "::error::the stale caller value survived"; exit 1
          fi
          echo "back-compat holds and the manifest outranks the input"

          rm -rf /tmp/build-secrets-merge /tmp/merge-output.txt /tmp/merge.log

      - name: A build arg variable stored as a secret is refused
        run: |
          set -euo pipefail
          # A build arg is published in the image metadata. Storing one as a secret
          # gets it masked in the log while it is written into the image anyway —
          # the worst of both, so this fails rather than warns.
          export VARS_JSON='{"APP_DOMAIN":"a.example"}'
          export SECRETS_JSON='{"PUBLIC_API_URL":"CANARY_MISFILED","PUBLIC_ANON_KEY":"k","BUILD_UPLOAD_TOKEN":"t"}'
          export ENVIRONMENT=production
          export DEPLOY_MANIFEST=tests/fixtures/buildargs/deploy-manifest.yml
          export SECRETS_DIR=/tmp/build-secrets-refused

          if python3 actions/render-build-args/render-build-args.py > /tmp/refused.log 2>&1; then
            echo "::error::a secret passed as a build arg variable was accepted"; exit 1
          fi
          cat /tmp/refused.log
          if grep -q 'CANARY_MISFILED' /tmp/refused.log; then
            echo "::error::the refusal printed the value"; exit 1
          fi
          rm -rf /tmp/build-secrets-refused /tmp/refused.log

  manifest:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 scripts/validate-manifest.py templates/deploy-manifest.yml
      - run: python3 scripts/validate-manifest.py tests/fixtures/*/deploy-manifest.yml

      - name: Environment conventions and the on/off switch
        run: |
          set -euo pipefail
          # The namespace and registry prefix a deploy uses are conventions, not
          # written in any app repo's manifest. That makes them a contract with every
          # live release: change a prefix and the next deploy pushes an image the
          # cluster cannot pull; change a namespace and helm creates a second release
          # beside the running one.
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "actions/resolve-target")
          from target import load_manifest, resolve
          from pathlib import Path

          m = load_manifest(Path("tests/fixtures/omnicasa-tools/deploy-manifest.yml"))
          app = m["app"]
          expected = {
              # environment    namespace            registry repository
              "dev":        (f"dev-{app}",      f"dev/{app}"),
              "staging":    (app,               f"staging/{app}"),
              # prodtest builds its own image: stage-k8s and prod-k8s have separate
              # registries, so it cannot read a path that exists only in the other one.
              "prodtest":   (f"prodtest-{app}", f"prodtest/{app}"),
              "production": (app,               f"production/{app}"),
              # An environment nobody named behaves as it did before the conventions
              # existed — this is what keeps repos on the two-environment flow working.
              "sandbox":    (app,               f"sandbox/{app}"),
          }
          for env, (ns, repo) in expected.items():
              t = resolve(m, env)
              assert t.namespace == ns, f"{env}: namespace {t.namespace} != {ns}"
              assert t.repository == repo, f"{env}: repository {t.repository} != {repo}"
              assert t.enabled is True, f"{env}: should default to enabled"
              assert t.app == app, f"{env}: app renamed to {t.app}"

          # Promotion is opt-in per repo now that it is not the default. This is the
          # exact line a repo adds once it can pull across registries.
          promote = dict(m, environments={"prodtest": {"repositoryPrefix": "staging"}})
          assert resolve(promote, "prodtest").repository == f"staging/{app}"
          assert resolve(promote, "prodtest").namespace == f"prodtest-{app}"

          # An explicit namespace is verbatim: the prefix must not stack onto a name
          # someone chose, because that name is what the RBAC and pull secret exist for.
          override = dict(m, environments={"dev": {"namespace": "tools-sandbox"}})
          assert resolve(override, "dev").namespace == "tools-sandbox"

          # The on/off switch, both spellings the workflow gates on.
          off = dict(m, environments={"prodtest": {"enabled": False}})
          assert resolve(off, "prodtest").enabled is False
          assert resolve(off, "staging").enabled is True
          assert resolve(dict(m, enabled=False), "production").enabled is False
          print("conventions and the on/off switch hold")
          PY

      - name: Validator rejects a broken manifest
        run: |
          set -euo pipefail
          cat > /tmp/bad.yml <<'EOF'
          app: Bad_Name
          namespace: bad
          env:
            variables:
              - DUP
            secrets:
              - DUP
          EOF
          if python3 scripts/validate-manifest.py /tmp/bad.yml; then
            echo "::error::validator accepted a manifest it must reject"; exit 1
          fi
          echo "validator rejects broken manifests"

  chart:
    name: Chart lint and golden render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4.2.0
        with:
          version: ${{ env.HELM_VERSION }}

      - run: helm lint "$CHART"

      - name: Schema rejects an unknown key
        run: |
          set -euo pipefail
          echo 'replicasCount: 3' > /tmp/typo.yaml
          if helm template t "$CHART" -f /tmp/typo.yaml >/dev/null 2>&1; then
            echo "::error::values.schema.json accepted a typo'd key"; exit 1
          fi
          echo "schema rejects unknown keys"

      - name: Golden render is unchanged
        run: |
          set -euo pipefail
          helm template omnicasa-tools "$CHART" -n omnicasa-tools \
            -f "$CHART/values.yaml" \
            -f tests/fixtures/omnicasa-tools/values.yaml \
            -f tests/fixtures/omnicasa-tools/release-values.yaml \
            > /tmp/rendered.yaml

          # The golden file is the contract with every live release. A diff here means
          # a chart change alters running workloads — intended sometimes, never silently.
          if ! diff -u tests/golden/omnicasa-tools.yaml /tmp/rendered.yaml; then
            echo "::error::chart output changed. If intended, update tests/golden/ and say why in CHANGELOG.md"
            exit 1
          fi
          echo "golden render matches"

      - name: Names and selectors are stable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml, sys
          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          # Every existing release was created by a chart whose selector was
          # {app.kubernetes.io/name: <release>, app.kubernetes.io/instance: <release>}.
          # Deployment.spec.selector is immutable, so drifting from this breaks every
          # upgrade of every already-deployed app.
          want = {"app.kubernetes.io/name": "omnicasa-tools",
                  "app.kubernetes.io/instance": "omnicasa-tools"}
          seen = {}
          for d in docs:
              seen[d["kind"]] = d["metadata"]["name"]
              if d["kind"] == "Deployment":
                  assert d["metadata"]["name"] == "omnicasa-tools", d["metadata"]["name"]
                  assert d["spec"]["selector"]["matchLabels"] == want, d["spec"]["selector"]
              if d["kind"] == "Service":
                  assert d["spec"]["selector"] == want, d["spec"]["selector"]
          for kind, name in (("Deployment", "omnicasa-tools"), ("Service", "omnicasa-tools"),
                             ("Ingress", "omnicasa-tools"), ("Secret", "omnicasa-tools-secrets"),
                             ("ConfigMap", "omnicasa-tools-config")):
              assert seen.get(kind) == name, f"{kind} is {seen.get(kind)}, expected {name}"
          print("names and selectors stable")
          PY

      - name: Optional features render
        run: |
          set -euo pipefail
          # Every opt-in block, on at once — these are off by default so nothing else
          # in CI would ever render them.
          cat > /tmp/all-on.yaml <<'EOF'
          migration:
            enabled: true
            command:
              - npx
              - prisma
              - migrate
              - deploy
          autoscaling:
            enabled: true
          podDisruptionBudget:
            enabled: true
          cronJobs:
            - name: nightly
              schedule: "0 2 * * *"
              command:
                - node
                - sync.js
          extraManifests:
            - apiVersion: v1
              kind: ConfigMap
              metadata:
                name: "{{ .Release.Name }}-extra"
              data:
                hello: world
          EOF
          helm template t "$CHART" -f "$CHART/values.yaml" -f /tmp/all-on.yaml > /tmp/all-on-out.yaml
          for kind in Job ScaledObject PodDisruptionBudget CronJob; do
            grep -q "kind: $kind" /tmp/all-on-out.yaml || { echo "::error::$kind did not render"; exit 1; }
          done
          grep -q 't-extra' /tmp/all-on-out.yaml || { echo "::error::extraManifests not templated"; exit 1; }
          echo "optional features render"

      - name: Values needing quoting survive
        run: |
          set -euo pipefail
          # A value containing a quote, a colon and a newline broke the old
          # ConfigMap template, which wrapped values in hand-written quotes.
          python3 - <<'PY' > /tmp/nasty.yaml
          import json
          nasty = 'has "quotes": and\na newline, plus, commas'
          print(json.dumps({"config": {"env": {
              "variables": {"NASTY": nasty},
              "secrets": {"NASTY_SECRET": nasty}}}}))
          PY
          helm template t "$CHART" -f "$CHART/values.yaml" -f /tmp/nasty.yaml > /tmp/nasty-out.yaml
          python3 - <<'PY'
          import base64, yaml
          nasty = 'has "quotes": and\na newline, plus, commas'
          docs = {d["kind"]: d for d in yaml.safe_load_all(open("/tmp/nasty-out.yaml")) if d}
          assert docs["ConfigMap"]["data"]["NASTY"] == nasty
          assert base64.b64decode(docs["Secret"]["data"]["NASTY_SECRET"]).decode() == nasty
          print("awkward values round-trip intact")
          PY

  kubeconform:
    name: Rendered manifests are valid Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4.2.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          # Not Dependabot-managed: this is a URL, not a `uses:`, so it drifts silently.
          version=v0.6.7
          sha256=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          url="https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz"

          # Download to a FILE, never straight into tar. `curl -f` writes nothing at all
          # on an HTTP error, so a failed fetch reaches tar as an empty stream and it
          # reports "gzip: stdin: unexpected end of file" — blaming the archive for what
          # was a transient 5xx from the release CDN. That happened on a docs-only PR.
          # --retry alone covers timeouts and 5xx, which is the failure seen. Not
          # --retry-all-errors: that needs curl 7.71+, and pinning CI to a curl feature
          # is a second thing to be wrong about.
          curl -sSfL --retry 5 --retry-delay 2 -o /tmp/kubeconform.tar.gz "$url"

          # Also turns a truncated or substituted download into a clear failure rather
          # than a confusing tar error.
          echo "$sha256  /tmp/kubeconform.tar.gz" | sha256sum -c -

          tar -xzf /tmp/kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate against the cluster's Kubernetes version
        run: |
          set -euo pipefail
          helm template omnicasa-tools "$CHART" -n omnicasa-tools \
            -f "$CHART/values.yaml" \
            -f tests/fixtures/omnicasa-tools/values.yaml \
            -f tests/fixtures/omnicasa-tools/release-values.yaml \
          | kubeconform -strict -summary \
              -kubernetes-version 1.32.0 \
              -schema-location default \
              -ignore-missing-schemas   # KEDA ScaledObject is a CRD
