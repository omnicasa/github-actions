# SUPERSEDED — renamed. Use caller-deploy-no-staging.yml, which is this file plus a
# header explaining how it relates to caller-deploy.yml. "1branch" stopped meaning
# anything once every repo runs a single long-lived branch.
#
# Original notes:
#
# Copy to .github/workflows/deploy.yml in a single-branch app repo (main -> production).
#
# @v1 is the floating major tag, moved only by the shared repo's release workflow after
# CI passes. Keep it: the reusable workflow invokes its own composite actions at @v1 too,
# so a mixed ref here would combine two versions of the pipeline.

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Render and diff against the live release, do not upgrade"
        type: boolean
        default: false

permissions:
  contents: read
  # The reusable deploy workflow's `deploy` job declares `id-token: write` — a called
  # workflow's permissions can only be EQUAL OR MORE RESTRICTIVE than the caller's, so
  # a caller that grants less fails the job outright rather than degrading. Required
  # since v1.10.0 whether or not this repo uses the Doppler tier that consumes the token.
  id-token: write

jobs:
  deploy:
    uses: omnicasa/github-actions/.github/workflows/deploy.yml@v1
    with:
      environment: production
      dry-run: ${{ inputs.dry-run == true }}
    # Passes the repo, org and environment secrets through. The called workflow
    # declares `environment:`, which is what makes the environment's secrets resolve.
    secrets: inherit
