# Copy to .github/workflows/branch-guard.yml in every app repo.
#
# Fails a PR whose source branch is not one of the house branch kinds, so the naming
# rule is visible in the PR checks rather than only in a settings page someone has to
# know to look at.
#
#   feat/  fix/  perf/  refactor/  chore/  ci/  hotfix/   ─PR─> main
#
# Make it a REQUIRED status check on `main`, and back it with a GitHub ruleset — a
# check explains the rule, a ruleset enforces it against anyone who can bypass checks.
# The guard only runs on `pull_request`, so a direct push to main bypasses it entirely;
# requiring PRs on main is what closes that. See docs/multi-environment.md.

name: Branch guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    uses: omnicasa/github-actions/.github/workflows/branch-guard.yml@v1
    # Default for `main` is the house convention: feat/, fix/, perf/, refactor/,
    # chore/, ci/, hotfix/. Override `allowed-into-main` only if this repo differs —
    # for example a repo that still keeps a develop integration branch.
