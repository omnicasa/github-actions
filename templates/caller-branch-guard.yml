# Copy to .github/workflows/branch-guard.yml in every app repo.
#
# Fails a PR whose source branch is not allowed into its target, so the gitflow is
# visible in the PR checks rather than only in a settings page someone has to know
# to look at.
#
# Make it a REQUIRED status check on both `main` and `develop`, and back it with a
# GitHub ruleset — a check explains the rule, a ruleset enforces it against anyone
# who can bypass checks. See docs/multi-environment.md.

name: Branch guard

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  guard:
    uses: omnicasa/github-actions/.github/workflows/branch-guard.yml@v1
    # Defaults encode the house convention:
    #   into main    : develop, hotfix/*
    #   into develop : feat/*, fix/*, chore/*, refactor/*, hotfix/*
    # Override only if this repo genuinely differs.
