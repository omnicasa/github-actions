# SUPERSEDED — do not use for new repos. Use caller-deploy.yml.
#
# This template deploys staging on a PUSH to develop, so code reaches a shared branch
# first and is tested afterwards. The adopted flow deploys staging from the PULL
# REQUEST into `main` instead: a change is tested before it is anywhere shared, and
# there is no develop branch at all.
#
# Kept only for reference while repos migrate. See docs/multi-environment.md.
#
# Original notes:
# Two-branch app repo. main -> production, develop -> staging, mapping in the one
# expression below. Repos whose branches are already named `staging` and
# `production` can simplify to `environment: ${{ github.ref_name }}`.

name: Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - staging
          - production
        required: true
      dry-run:
        description: "Render and diff against the live release, do not upgrade"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    uses: omnicasa/github-actions/.github/workflows/deploy.yml@v1
    with:
      environment: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
