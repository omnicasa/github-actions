# Copy to .github/workflows/deploy.yml in a repo that has NO staging cluster entry.
#
#   {feat,fix,perf,refactor,chore,ci,hotfix}/*  ─PR─> main   branch guard only, no deploy
#   push to main                                     deploys PRODUCTION
#
# Identical to caller-deploy.yml minus the staging lane, so switching is a two-line
# change once the repo has a staging namespace, RBAC, pull secret and a `staging`
# GitHub Environment. Until then a PR is reviewed but never runs anywhere.
#
# @v1 is the floating major tag, moved only by the shared repo's release workflow after
# CI passes. Keep it: the reusable workflow invokes its own composite actions at @v1 too,
# so a mixed ref here would combine two versions of the pipeline.

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Render and diff against the live release, do not upgrade"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    uses: omnicasa/github-actions/.github/workflows/deploy.yml@v1
    with:
      environment: production
      dry-run: ${{ inputs.dry-run == true }}
    # Passes the repo, org and environment secrets through. The called workflow
    # declares `environment:`, which is what makes the environment's secrets resolve.
    secrets: inherit
