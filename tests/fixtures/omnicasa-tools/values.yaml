# Fixture mirroring omnicasa-tools' deploy/values.yaml.
# Kept byte-identical to the real file so the golden render means something.

# Chart overrides for omnicasa-tools.
#
# Every value here was copied from the old k8s/helm/omnicasa-tools/values.yaml so the
# first deploy on the new pipeline changes only what it is meant to change. Verified
# with `helm template` against both charts: all object names and the Deployment and
# Service selectors come out byte-identical.
#
# Per-environment app config does NOT belong here — it comes from the GitHub
# Environment via the manifest. This file is only the shape of the release.

replicaCount: 2

service:
  containerPort: 3000
  port: 80

ingress:
  enabled: true
  className: haproxy
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    cert-manager.io/cluster-issuer: letsencrypt

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  # Explicit because probe maps MERGE with the chart defaults: without this the
  # chart's failureThreshold of 6 would apply, where the old chart relied on the
  # Kubernetes default of 3. Same restart behaviour as before the migration.
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The old chart carried autoscaling.* values but shipped no HPA template, so this
# has never actually done anything. The unified chart renders a KEDA ScaledObject
# when enabled — leave it off until someone decides the thresholds are right.
autoscaling:
  enabled: false

# A PodDisruptionBudget at 50% on this Deployment would block node drains.
podDisruptionBudget:
  enabled: false

# Prisma was removed from this app; there is no migration to run.
migration:
  enabled: false
