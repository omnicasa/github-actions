# Source: omnicasa-app/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: omnicasa-tools-config
  labels:
    helm.sh/chart: omnicasa-app-0.1.0
    app.kubernetes.io/name: omnicasa-tools
    app.kubernetes.io/instance: omnicasa-tools
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  # Values go through `quote`, never through a hand-written pair of double quotes:
  # a value containing a double quote, a colon or a newline produces invalid YAML
  # otherwise. ADMIN_EMAILS and any JSON-valued variable hit this. The Deployment
  # checksums this rendered output, so a change here rolls the pods.
  ADMIN_EMAILS: "a@b.com,c@d.com"
  AUTH_TRUST_HOST: "true"
  AUTH_URL: "https://tools.omnicasa.com"
  CUSTOMER_DB_CONNECT_TIMEOUT_MS: "45000"
  EMAIL_FROM: "noreply@omnicasa.com"
  NODE_ENV: "production"
  SMTP_HOST: "smtp.postmarkapp.com"
  SMTP_PORT: "587"
