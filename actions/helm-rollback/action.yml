name: Helm rollback
description: Roll a release back to a previous revision.

inputs:
  release:
    description: Helm release name
    required: true
  namespace:
    description: Namespace holding the release
    required: true
  revision:
    description: Revision to roll back to. Blank means the previous one.
    required: false
    default: ""
  timeout:
    description: helm rollback timeout
    required: false
    default: 10m
  rollout-timeout:
    description: kubectl rollout status timeout
    required: false
    default: 5m

outputs:
  revision:
    description: >-
      Helm revision after the attempt, whatever it ended up being — captured even
      when the rollback failed, since on-call needs to know where the release
      actually landed, not just where it was aimed.
    value: ${{ steps.rollback.outputs.revision }}

runs:
  using: composite
  steps:
    - name: Show history before rolling back
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        # Printed BEFORE the rollback on purpose: afterwards this view no longer
        # shows the state the decision was made from.
        helm history "$RELEASE" -n "$NAMESPACE" --max 10 | tee /tmp/helm-history.txt
        {
          echo "### Helm history before rollback — $RELEASE ($NAMESPACE)"
          echo '```'
          cat /tmp/helm-history.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Unstick a pending release
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        # Same recovery helm-deploy runs before its upgrade. `helm rollback` has no
        # --atomic (no Helm 3 version does), so a timed-out rollback leaves the
        # release stuck in pending-rollback with nothing to clear it — including a
        # later rollback attempt.
        status=$(helm status "$RELEASE" -n "$NAMESPACE" -o json 2>/dev/null \
                 | jq -r '.info.status // empty' || true)
        case "$status" in
          pending-upgrade|pending-install|pending-rollback)
            echo "::warning::release stuck in $status — rolling back before retrying"
            helm rollback "$RELEASE" -n "$NAMESPACE" || true
            ;;
          *)
            echo "release status: ${status:-not installed}"
            ;;
        esac

    - name: Roll back
      id: rollback
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        NAMESPACE: ${{ inputs.namespace }}
        REVISION: ${{ inputs.revision }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -uo pipefail
        # Not `set -e`: a failed rollback must still reach the revision capture
        # below, or on-call is told nothing about where the release landed.
        # --cleanup-on-fail is the closest rollback gets to --atomic: it deletes
        # resources this attempt created if it fails. An empty revision argument
        # means "the previous release" to helm.
        # shellcheck disable=SC2086
        helm rollback "$RELEASE" $REVISION \
          -n "$NAMESPACE" \
          --wait \
          --cleanup-on-fail \
          --timeout "$TIMEOUT"
        rc=$?

        rev=$(helm status "$RELEASE" -n "$NAMESPACE" -o json | jq -r '.version')
        echo "revision=$rev" >> "$GITHUB_OUTPUT"

        if [ "$rc" -ne 0 ]; then
          echo "::error::rollback failed; release is now at revision $rev"
          exit "$rc"
        fi
        echo "::notice::rolled back $RELEASE to revision $rev"

    - name: Verify rollout
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        NAMESPACE: ${{ inputs.namespace }}
        ROLLOUT_TIMEOUT: ${{ inputs.rollout-timeout }}
      run: |
        set -euo pipefail
        kubectl rollout status "deployment/$RELEASE" \
          --namespace "$NAMESPACE" \
          --timeout="$ROLLOUT_TIMEOUT"
        kubectl get pods -n "$NAMESPACE" -o wide
