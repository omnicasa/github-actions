name: Slack notify
description: >-
  Post a Block Kit message to a Slack incoming webhook. No-ops if webhook-url is
  blank, so a repo without the org secret granted just skips.

# Input contract mirrors actions/teams-notify, so the two call sites in a notify job
# stay reviewable side by side. Composite actions cannot read the `secrets` context,
# hence webhook-url as an input.

inputs:
  webhook-url:
    description: Slack incoming webhook URL. Blank skips the post entirely.
    required: true
  status:
    description: success | failure | cancelled — picks the attachment colour
    required: true
  title:
    description: Message headline
    required: true
  facts:
    description: 'Multiline "Key: Value" pairs, rendered as Block Kit section fields'
    required: false
    default: ""
  run-url:
    description: Link added as an "Open run" button. Blank omits the button.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        FACTS: ${{ inputs.facts }}
        RUN_URL: ${{ inputs.run-url }}
      run: bash "${{ github.action_path }}/notify.sh"
