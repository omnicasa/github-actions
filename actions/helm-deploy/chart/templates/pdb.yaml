{{- if .Values.podDisruptionBudget.enabled }}
# Opt-in. The upstream scaffold rendered this unconditionally at
# maxUnavailable: 50%, which on a single-replica Deployment evaluates to zero
# allowed disruptions and blocks every node drain until someone deletes it by hand.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
{{- end }}
