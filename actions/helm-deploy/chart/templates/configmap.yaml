apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  # Values go through `quote`, never through a hand-written pair of double quotes:
  # a value containing a double quote, a colon or a newline produces invalid YAML
  # otherwise. ADMIN_EMAILS and any JSON-valued variable hit this. The Deployment
  # checksums this rendered output, so a change here rolls the pods.
  {{- range $key, $val := .Values.config.env.variables }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
