apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-secrets
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  # GitHub masks the literal secret in the log but NOT this base64 form, which is
  # why the workflow runs `helm diff` with --suppress-secrets.
  {{- range $key, $val := .Values.config.env.secrets }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
